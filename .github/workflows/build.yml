# Build file exe Windows cho AutoClickTool, chay tren may Windows cua GitHub.
#
# Vi PyInstaller chi build duoc cho dung he dieu hanh no dang chay, nen
# khong the build exe Windows tren may Linux - workflow nay lam viec do:
# moi lan push tag vX.Y.Z (vd v1.1.1), hoac bam Run workflow o tab Actions,
# GitHub se build tren windows-latest roi gan AutoClickTool.exe (+ zip)
# vao release cua tag do. Tu do tinh nang tu cap nhat trong app moi tim
# thay file exe de tai ve.
name: Build exe

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag cua release can gan exe (vd v1.1.1)'
        required: true
        default: 'v1.1.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cai Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pynput pystray pillow pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean AutoClickTool.spec

      - name: Kiem tra exe
        run: |
          Get-Item dist\AutoClickTool.exe | Select-Object Length, FullName
          python -m py_compile AutoClickTool.pyw

      - name: Dong goi zip
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME } else { $tag = '${{ inputs.tag }}' }
          Compress-Archive -Path 'dist\AutoClickTool.exe','README.md' -DestinationPath "AutoClickTool-$tag.zip" -Force
          Get-Item "AutoClickTool-$tag.zip" | Select-Object Length, FullName

      - name: Gan exe + zip vao release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: |
            dist/AutoClickTool.exe
            AutoClickTool-*.zip
